# main 브랜치에 반영되면 Firebase Hosting(https://oneulmohae-family.web.app)과 보안 규칙(firestore.rules)을 자동 배포
name: Firebase Hosting 배포

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ONEULMOHAE_FAMILY }}
          projectId: oneulmohae-family
          channelId: live
      - name: 보안 규칙 배포
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ONEULMOHAE_FAMILY }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" npx -y firebase-tools@13.35.1 deploy --only firestore:rules --project oneulmohae-family --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
