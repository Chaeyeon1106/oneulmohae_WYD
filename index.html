  return ms.length > 1 && ms.length < 4 ? `<span class="dots">${ms.slice(1).map(m => `<i style="background:${safeColor(m.color)}"></i>`).join('')}</span>` : '';
}

function viewCal(){
  const t = today(), ts = ymd(t);
  const y = state.month.getFullYear(), mo = state.month.getMonth();
  const first = new Date(y, mo, 1), start = addDays(first, -first.getDay());  // 일요일 시작
  const evs = eventList();
  const pass = e => state.filter === 'all' || (e.members||[]).includes(state.filter);
  const N = state.chipN || 3;

  let cells = '', rows = 0;
  for(let w = 0; w < 6; w++){
    const ws = addDays(start, w * 7);
    if(w >= 4 && ws.getMonth() !== mo) break;
    rows++;
    const days = Array.from({length: 7}, (_, i) => addDays(ws, i)), dss = days.map(ymd);
    const inM = days.map(d => d.getMonth() === mo);

    // 이번 주에 걸친 일정 조각들
    const segs = [];
    for(const e of evs){
      if(!pass(e)) continue;
      const seen = new Set();
      dss.forEach(ds => {
        const s = occStart(e, ds); if(s == null || seen.has(s)) return; seen.add(s);
        const end = ymd(addDays(parse(s), evDur(e)));
        let a = dss.findIndex(x => x >= s), b = 6; while(b >= 0 && dss[b] > end) b--;
        while(a <= b && !inM[a]) a++; while(b >= a && !inM[b]) b--;
        if(a < 0 || a > b) return;
        segs.push({e: withEx(e, s), a, b, multi: evDur(e) > 0, cl: s < dss[a], cr: end > dss[b]});
      });
    }
    days.forEach((d, i) => { if(inM[i]) annOn(d).forEach(an => segs.push({an, a:i, b:i, multi:false})); });
    segs.sort((p, q) => (q.multi - p.multi) || (p.a - q.a) || ((q.b - q.a) - (p.b - p.a)) || ((p.an ? 0 : 1) - (q.an ? 0 : 1)) || byTime(p.e || {}, q.e || {}));

    // 줄 배정: 겹치지 않는 가장 위 줄
    const lanes = [];
    segs.forEach(sg => {
      let l = 0; while(lanes[l] && lanes[l].slice(sg.a, sg.b + 1).some(Boolean)) l++;
      if(!lanes[l]) lanes[l] = Array(7).fill(false);
      for(let i = sg.a; i <= sg.b; i++) lanes[l][i] = true;
      sg.lane = l;
    });
    const overflow = days.some((_, i) => segs.filter(sg => sg.a <= i && sg.b >= i).length > N);
    const maxLane = overflow ? N - 1 : N;

    days.forEach((d, i) => {
      const ds = dss[i];
      if(!inM[i]){ cells += `<span class="cell out" aria-hidden="true"></span>`; return; }
      const here = segs.filter(sg => sg.a <= i && sg.b >= i);
      const vis = here.filter(sg => sg.lane < maxLane), hidden = here.length - vis.length;
      const top = vis.reduce((m, sg) => Math.max(m, sg.lane), -1);
      let html = '';
      for(let l = 0; l <= top; l++){
        const sg = vis.find(x => x.lane === l);
        if(!sg){ html += '<span class="chip gap"></span>'; continue; }
        if(sg.an){ html += `<span class="chip an">${annEmoji(sg.an)}${h(annTitle(sg.an))}</span>`; continue; }
        if(sg.multi){
          if(i !== sg.a){ html += '<span class="chip gap"></span>'; continue; }
          const span = sg.b - sg.a + 1, ex = (sg.cl ? 2 : 0) + (sg.cr ? 3 : 0);
          html += `<span class="chip bar ${sg.cl?'cl':''} ${sg.cr?'cr':''} ${isFam(sg.e)?'fam':''}" style="${chipPaint(sg.e, true)};--span:${span};--ex:${ex}px">${sg.cl ? '◂ ' : `<span class="e">${h(sg.e.emoji||'')}</span>`}${h(sg.e.title)}${barDots(sg.e)}</span>`;
          continue;
        }
        html += `<span class="chip ${isFam(sg.e)?'fam':''}" style="${chipPaint(sg.e)}"><span class="e">${h(sg.e.emoji||'')}</span>${h(sg.e.title)}</span>`;
      }
      if(hidden > 0) html += `<span class="chip more">+${hidden}</span>`;
      const hol = holidayOn(ds);
      const cls = ['cell', ds===ts?'today':'', d.getDay()===0?'sun':'', hol?'hol':''].join(' ');
      cells += `<button class="${cls}" data-act="pick" data-date="${ds}" aria-label="${fmtMD(d)}${hol ? ' ' + hol : ''} 일정 ${here.length}개"><span class="dnrow"><span class="dn">${pad(d.getDate())}</span>${hol ? `<span class="hname">${h(holShort(hol))}</span>` : ''}</span>${html}</button>`;
    });
  }

  const P = MONTHS[mo];
  const prev = new Date(y, mo-1, 1), next = new Date(y, mo+1, 1);
  const mini = (d, v) => { const q = pal(d.getMonth()); return `<button class="mini ${v<0?'prev':'next'}" style="--b:${q.bg};--i:${q.ink}" data-act="mon" data-v="${v}" aria-label="${d.getMonth()+1}월로">
    <b>${v<0?'‹ ':''}${d.getMonth()+1}월${v>0?' ›':''}</b><i>${q.en}</i><span class="lines"></span></button>`; };

  const legend = [`<button class="fchip all ${state.filter==='all'?'on':''}" data-act="filter" data-v="all">모두</button>`]
    .concat(members().map(m => `<button class="fchip ${state.filter===m.id?'on':''}" data-act="filter" data-v="${m.id}"><span class="sq" style="background:${safeColor(m.color)}"></span>${h(m.title)}</button>`)).join('');

  return `
    <section class="poster" aria-label="${y}년 ${mo+1}월 달력">
      <div class="p-top">
        <button class="p-month ${mo >= 9 ? 'long' : ''}" data-act="mon" data-v="0" title="오늘로 가기"><span class="ko">${mo+1}월</span><span class="en">${P.en}</span></button>
        <span class="p-year">${y}</span>
        <div class="p-nav">${mini(prev, -1)}${mini(next, 1)}</div>
      </div>
      <div class="filters" role="group" aria-label="가족별로 보기">${legend}</div>
      <div class="p-wk">${[0,1,2,3,4,5,6].map(i => `<span class="${i===0?'sun':''}">${WD[i]}</span>`).join('')}</div>
      <div class="p-grid" style="--rows:${rows}">${cells}</div>
    </section>`;
}
/* 칸 높이에 맞춰 보여줄 일정 막대 개수를 정해요 */
function fitTitle(){

/* 제안: 가족 모두 찬성하면 확정 (경매처럼 하나요, 둘이요 … 땅땅땅!) */
function voteInfo(n){
  const ids = members().map(m => m.id);
  const votes = new Set([n.by, ...Object.entries(n.likes || {}).filter(([,v]) => v).map(([k]) => k)].filter(id => ids.includes(id)));
  const cnt = votes.size, total = ids.length, left = total - cnt;
  const call = cnt >= total ? '땅땅땅! 확정 🔨' : left === 1 ? '한 명만 더!' : ['','하나요!','둘이요!','셋이요!','넷이요!'][cnt] || cnt + '명!';
  return {votes:[...votes], cnt, total, done: cnt >= total, call};
}
/* 메모 읽음: 글쓴이 말고 누가 읽었는지 */
function readRow(n){
  const readers = Object.entries(n.reads || {}).filter(([k, v]) => v && k !== n.by).map(([k]) => k);
  const mine = readers.includes(ME);
  return `<div class="reads">
    ${n.by === ME ? `<span class="rd-lbl">${readers.length ? '읽음' : '아직 아무도 안 읽었어요'}</span>`
      : `<button class="rd ${mine ? 'on' : ''}" data-act="nb-read" data-id="${h(n.id)}" aria-pressed="${mine}">${mine ? '✓ 읽음' : '☐ 읽었어요'}</button>`}
    <span class="avs">${readers.map(k => av(mem(k), 'sm')).join('')}</span>
  </div>`;
}
function noteCard(n){
  const m = mem(n.by), c = NOTE_COLORS.includes(n.color) ? n.color : 'yellow';
  let sug = '';
  if(n.kind === 'suggest'){
    const v = voteInfo(n), mine = v.votes.includes(ME);
    sug = `<div class="gauge ${v.done?'done':''}" role="meter" aria-valuemin="0" aria-valuemax="${v.total}" aria-valuenow="${v.cnt}" aria-label="찬성 ${v.cnt}명">
        <i style="width:${Math.round(v.cnt / v.total * 100)}%"></i>${Array.from({length: v.total - 1}, (_, i) => `<em style="left:${Math.round((i+1) / v.total * 100)}%"></em>`).join('')}
      </div>
      <div class="gauge-call"><b>${v.call}</b><span>${v.cnt}/${v.total}</span></div>
      <div class="voters">${v.votes.map(id => av(mem(id),'sm')).join('')}</div>
      ${v.done ? '<span class="stamp">확정</span>' : n.by === ME ? '' : `<button class="agree ${mine?'on':''}" data-act="nb-like" data-id="${h(n.id)}">${mine ? '✓ 찬성했어요' : '🙋 찬성!'}</button>`}`;
  }
  return `<article class="note ${n.kind==='suggest'?'sug':''}" style="--nc:var(--note-${c});--r:${Number(n.rot)||0}deg;--mag:${NOTE_MAG[c]}">
    ${n.kind==='suggest' ? '<span class="sug-tag">💡 제안</span>' : ''}

function closeModal(){
  if(state.modal && state.modal.kind === 'who' && !ME) return;
  state.modal = null; renderModal();
}
function renderModal(){
  const root = $('#modal');
  if(!state.modal){ root.hidden = true; root.innerHTML = ''; document.body.classList.remove('modal-open'); return; }
  root.hidden = false; document.body.classList.add('modal-open');
  preserve(root, () => { root.innerHTML = `<div class="scrim" data-act="close"></div><div class="sheet" role="dialog" aria-modal="true">${MODALS[state.modal.kind](state.modal)}</div>`; });

          <label class="fld"><span>연도 (선택)</span><input type="number" id="a-year" data-draft inputmode="numeric" min="1900" max="2100" value="${h(a.year||'')}" placeholder="1985"></label>

      <div class="m-foot">${id ? `<button class="btn danger left" data-act="del-an" data-id="${h(id)}">삭제</button>` : ''}<button class="btn" data-act="close">취소</button><button class="btn pri" data-act="save-an">저장</button></div>`;

      <div class="row2">
        <div class="fld"><span>교대 주기</span><div class="seg" id="c-freq">${[['daily','매일'],['weekly','매주']].map(([k,l]) => `<button type="button" class="${(c.freq||'daily')===k?'on':''}" data-act="seg-pick" data-v="${k}">${l}</button>`).join('')}</div></div>

      <div class="m-foot">${m.id ? `<button class="btn danger left" data-act="del-ch" data-id="${h(m.id)}">삭제</button>` : ''}<button class="btn" data-act="close">취소</button><button class="btn pri" data-act="save-ch">저장</button></div>`;

  pf(m){

        <div style="display:flex;gap:8px;flex-wrap:wrap"><label class="btn file-lbl">${m.busy ? '올리는 중…' : '사진 바꾸기'}<input type="file" id="pf-file" accept="image/*"></label>${m.photo ? `<button class="btn" data-act="crop-again">위치·크기 조정</button><button class="btn danger" data-act="pf-nophoto">사진 빼기</button>` : ''}</div></div>
      <div class="row2">
        <label class="fld"><span>호칭</span><input type="text" id="pf-title" data-draft maxlength="8" value="${h(mb.title)}" placeholder="엄마"></label>
        <label class="fld"><span>이름</span><input type="text" id="pf-name" data-draft maxlength="12" value="${h(mb.name||'')}" placeholder="예) 이수진"></label>
      </div>
      <div class="fld"><span>내 색깔</span><div class="swatches">${PALETTE.map(c => `<button type="button" class="sw ${m.color.toLowerCase()===c.toLowerCase()?'on':''}" style="--c:${c}" data-act="pf-color" data-v="${c}" aria-label="색 ${c}"></button>`).join('')}<input type="color" id="pf-color" value="${m.color}" aria-label="직접 고르기"></div></div>
      <div class="m-foot"><button class="btn" data-act="close">취소</button><button class="btn pri" data-act="save-pf" ${m.busy?'disabled':''}>저장</button></div>`;

};
function rotPicks(rot){
  return members().map(m => { const i = rot.indexOf(m.id); return `<button type="button" class="pick ${i>=0?'on':''}" style="--c:${safeColor(m.color)}" data-act="rot-pick" data-id="${m.id}" aria-pressed="${i>=0}">${av(m,'sm')}${h(m.title)}${i>=0 ? `<span class="ord">${i+1}</span>` : ''}</button>`; }).join('');
}

/* ───────── 동작 ───────── */
let toastT = 0;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; t.style.animation = 'none'; void t.offsetWidth; t.style.animation = ''; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2200); }
/* 역할 바꾸기 암호 (원문 대신 해시만 저장) */
const SWITCH_PW_HASH = '';  // 로그인 방식으로 바뀌어 더 이상 쓰지 않음 (역할 = 로그인 계정)
function setMe(id){ ME = id; ls.set('tmh_me', ME); Push.syncMember(); state.modal = null; render(); toast(`${mem(ME).title}(으)로 들어왔어요 👋`); }
/* 이 날만 변경 기록 → 서버가 가족에게 알림 */
function logChange(c){ Store.set('changes', uid(), {...c, time: c.time || '', to: c.to || '', skip: !!c.skip, restore: !!c.restore, moved: !!c.moved, by: ME, at: Date.now()}); }
function needMe(){ if(ME && DEFAULT_MEMBERS[ME]) return true; openModal({kind:'who'}); return false; }
function arm(btn, text){ if(btn.dataset.armed) return true; btn.dataset.armed = '1'; btn.classList.add('armed'); btn.textContent = text || '정말 지울까요?'; setTimeout(() => { if(btn.isConnected){ delete btn.dataset.armed; btn.classList.remove('armed'); btn.textContent = btn.dataset.orig || '삭제'; } }, 3500); return false; }

const ACTIONS = {
  reload(el){ el.classList.add('spin'); setTimeout(() => location.reload(), 150); },
  tab(el){ state.tab = el.dataset.v; ls.set('tmh_tab', state.tab); render(); window.scrollTo({top:0}); },
  close(){ closeModal(); },
  who(){ openModal({kind: Auth.on ? 'acct' : 'who'}); },
  'auth-tab'(el){ Auth.tab = el.dataset.v; Auth.error = ''; render(); },
  'auth-role'(el){ Auth.role = el.dataset.id; $$('#au-role .pick').forEach(b => b.classList.toggle('on', b.dataset.id === Auth.role)); },
  async 'auth-go'(){
    if(Auth.busy) return;
    const id = ($('#au-id')?.value || '').trim(), pw = $('#au-pw')?.value || '';
    const code = ($('#au-code')?.value || '').trim(), role = Auth.role;
    const fail = m => { Auth.error = m; render(); };
    if(!id) return fail('아이디를 적어주세요.');
    if(Auth.email(id).length > 80) return fail('아이디가 너무 길어요.');
    if(pw.length < 6) return fail('비밀번호는 6자 이상이에요.');
    Auth.busy = true; Auth.error = ''; render();
    try{
      if(role && code){
        try{ await Auth.signUp(id, pw, role, code); }
        catch(e){
          if(!String(e.code || '').includes('email-already-in-use')) throw e;
          await Auth.login(id, pw);           // 이미 가입한 아이디 → 그냥 로그인
        }
      } else {
        try{ await Auth.login(id, pw); }
        catch(e){
          const c2 = String(e.code || '');
          if(c2.includes('invalid-credential') || c2.includes('user-not-found'))
            throw {code: 'first-time'};
          throw e;
        }
      }
      Auth.busy = false;
      ['au-id','au-pw','au-code'].forEach(k => { const i = document.getElementById(k); if(i) i.value = ''; });
      toast(`${mem(ME)?.title || ''}(으)로 들어왔어요 👋`);
    }catch(e){ console.warn(e); Auth.busy = false; fail(e && e.code === 'first-time' ? '아이디나 비밀번호가 달라요. 처음이라면 "나는 누구"와 가족 암호도 채워주세요.' : Auth.msg(e)); }
  },
  'pw-eye'(el){ const i = document.getElementById(el.dataset.v); if(i){ i.classList.toggle('secret'); el.classList.toggle('on'); } },

  async logout(el){ el.dataset.orig = el.textContent; if(!arm(el, '정말 로그아웃할까요?')) return; state.modal = null; await Auth.logout(); },
  'set-me'(el){
    const id = el.dataset.id;
    if(id === ME){ closeModal(); return; }
    // 이미 역할이 정해진 기기는 암호가 있어야 다른 가족으로 바꿀 수 있어요
    if(ME && DEFAULT_MEMBERS[ME]){ state.modal.pending = id; renderModal(); setTimeout(() => $('#who-pw')?.focus(), 30); return; }
    setMe(id);
  },
  async 'who-unlock'(){
    const pw = ($('#who-pw')?.value || '').trim();
    let ok = false;
    try{
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('oneulmohae:' + pw));
      ok = !!SWITCH_PW_HASH && [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join('') === SWITCH_PW_HASH;
    }catch(e){}
    if(!ok){ const er = $('#who-err'); if(er) er.hidden = false; const i = $('#who-pw'); if(i){ i.value = ''; i.focus(); } return; }
    setMe(state.modal.pending);
  },
  'goto-hero'(){ state.tab = 'set'; ls.set('tmh_tab','set'); render(); setTimeout(() => $('#hero-sec')?.scrollIntoView({behavior:'smooth', block:'center'}), 30); },

  mon(el){ goMonth(Number(el.dataset.v)); },
  pick(el){
    state.sel = el.dataset.date; const d = parse(state.sel);
    if(d.getMonth() !== state.month.getMonth() || d.getFullYear() !== state.month.getFullYear()) state.month = new Date(d.getFullYear(), d.getMonth(), 1);
    if(state.tab !== 'cal'){ state.tab = 'cal'; ls.set('tmh_tab','cal'); }
    state.modal = {kind:'day', date:state.sel, live:true};
    render();
  },
  filter(el){ state.filter = el.dataset.v; render(); },
  'new-ev'(el){ if(!needMe()) return; openModal({kind:'evEdit', date: el.dataset.date || state.sel}); },
  'open-ev'(el){ openModal({kind:'ev', id:el.dataset.id, date:state.sel, live:true}); },
  'edit-ev'(el){ openModal({kind:'evEdit', id:el.dataset.id}); },
  'day-pick'(el){ el.classList.toggle('on'); el.setAttribute('aria-pressed', el.classList.contains('on')); },
  'toggle-pick'(el){ el.classList.toggle('on'); el.setAttribute('aria-pressed', el.classList.contains('on')); },
  'save-ev'(){
    if(!needMe()) return;
    const title = $('#f-title').value.trim(), date = $('#f-date').value;
    if(!title){ toast('제목을 적어주세요'); $('#f-title').focus(); return; }
    if(!date){ toast('날짜를 골라주세요'); return; }
    const end = $('#f-end').value;
    if(end && end < date){ toast('끝나는 날이 시작하는 날보다 빨라요'); $('#f-end').focus(); return; }
    let ms = $$('#f-mems .pick.on').map(b => b.dataset.id); if(!ms.length) ms = [ME];
    const repv = $('#f-rep').value, until = repv !== 'none' ? ($('#f-until')?.value || '') : '';
    if(until && until < date){ toast('반복 끝나는 날이 시작하는 날보다 빨라요'); return; }
    let days = repv === 'weekly' ? $$('#f-days .dp.on').map(b => Number(b.dataset.v)) : [];
    if(repv === 'weekly' && !days.length) days = [parse(date).getDay()];
    const data = {title, date, days, until, endDate: end && end > date ? end : '', emoji: (state.modal.id && S.events[state.modal.id]?.emoji) || '', time:$('#f-time').value || '', members:ms, repeat:$('#f-rep').value, memo:$('#f-memo').value.trim()};
    const id = state.modal.id;
    if(id) Store.update('events', id, data);
    else Store.set('events', uid(), {...data, createdBy:ME, at:Date.now(), reactions:{}, comments:{}});
    state.sel = date; const d = parse(date); state.month = new Date(d.getFullYear(), d.getMonth(), 1);
    state.modal = id ? {kind:'ev', id, date, live:true} : {kind:'day', date, live:true};
    render(); toast(id ? '고쳤어요' : '일정을 붙였어요 📌');
  },
  'ev-x'(el){
    const e = S.events[el.dataset.id]; if(!e) return;
    if(!el.dataset.armed){
      el.dataset.armed = '1'; el.classList.add('armed');
      el.textContent = e.repeat && e.repeat !== 'none' ? '반복 전체 삭제?' : '삭제?';
      setTimeout(() => { if(el.isConnected){ delete el.dataset.armed; el.classList.remove('armed'); el.textContent = '✕'; } }, 3500);
      return;
    }
    Store.del('events', el.dataset.id); toast('일정을 지웠어요');
  },
  'del-ev'(el){ el.dataset.orig = el.textContent; if(!arm(el)) return; Store.del('events', el.dataset.id); state.modal = null; render(); toast('일정을 지웠어요'); },
  react(el){
    if(!needMe()) return;
    const e = S.events[el.dataset.id]; if(!e) return;
    const emo = el.dataset.v; const on = !!(e.reactions && e.reactions[emo] && e.reactions[emo][ME]);
    Store.update('events', el.dataset.id, {reactions:{[emo]:{[ME]: on ? null : true}}});
  },
  'cm-add'(el){
    if(!needMe()) return;
    const inp = $('#cm-text'); const text = inp.value.trim(); if(!text) return;
    Store.update('events', el.dataset.id, {comments:{[uid()]:{by:ME, text, at:Date.now()}}});
    inp.value = ''; inp.focus();
  },
  'cm-del'(el){ const c = S.events[el.dataset.id]?.comments?.[el.dataset.v]; if(!c || c.by !== ME) return; Store.update('events', el.dataset.id, {comments:{[el.dataset.v]: null}}); },

  nc(el){ state.noteColor = el.dataset.v; ls.set('tmh_nc', state.noteColor); renderModal(); },
  'nb-add'(){
    if(!needMe()) return;
    const ta = $('#nb-text'); const text = ta.value.trim();
    if(!text){ toast('메모 내용을 적어주세요'); ta.focus(); return; }
    const kind = state.noteKind === 'suggest' ? 'suggest' : 'memo';
    Store.set('notes', uid(), {text, kind, by:ME, color:state.noteColor, rot: Math.round((Math.random()*5 - 2.5)*10)/10, at:Date.now(), likes:{}});
    ta.value = ''; state.modal = null; render(); toast(kind === 'suggest' ? '제안을 올렸어요 💡' : '냉장고에 붙였어요');
  },
  nkind(el){ state.noteKind = el.dataset.v; renderModal(); },
  'new-note'(){ if(!needMe()) return; openModal({kind:'note'}); },
  'new-praise'(){ if(!needMe()) return; openModal({kind:'praise'}); },
  'praise-to'(el){ state.modal.to = el.dataset.id; $$('#modal .pick').forEach(b => { const on = b.dataset.id === el.dataset.id; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); }); },
  'praise-send'(){

/* ───────── 로그인: 아이디 + 비밀번호, 처음 한 번만 ─────────
   아이디는 내부적으로 가짜 이메일(u<16진수>@oneulmohae.family)로 바꿔서 Firebase 로그인에 써요 */
const Auth = {
  tab: 'login', error: '', busy: false, signingUp: false, on: false,
  /* Firebase 콘솔에서 이메일/비밀번호 로그인이 켜져 있는지 */
  async ready(){
    try{
      const r = await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=' + window.FIREBASE_CONFIG.apiKey, {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({email: 'probe@oneulmohae.family', password: 'probe-000000', returnSecureToken: false})
      });
      const j = await r.json().catch(() => ({}));
      const m = (j.error && j.error.message) || '';
      return !/CONFIGURATION_NOT_FOUND|OPERATION_NOT_ALLOWED/.test(m);
    }catch(e){ return true; }  // 오프라인이면 저장된 로그인 상태로
  },
  email(id){
    const hex = [...new TextEncoder().encode(id.trim().toLowerCase())].map(b => b.toString(16).padStart(2,'0')).join('');
    return 'u' + hex + '@oneulmohae.family';
  },
  async sha(s){ const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,'0')).join(''); },
  msg(e){
    const c = (e && e.code) || '';

    if(c.includes('email-already-in-use')) return '이미 있는 아이디예요. 다른 아이디를 써 주세요.';
    if(c.includes('weak-password')) return '비밀번호는 6자 이상으로 해 주세요.';
    if(c.includes('too-many-requests')) return '너무 여러 번 시도했어요. 잠시 후 다시 해 주세요.';
    if(c.includes('network')) return '인터넷 연결을 확인해 주세요.';
    if(c.includes('configuration-not-found') || c.includes('operation-not-allowed')) return '로그인 기능이 아직 준비 중이에요.';
    if(c === 'permission-denied') return '가족 암호가 틀렸거나, 이미 가입된 역할이에요.';

  },
  async login(id, pw){

  },
  async signUp(id, pw, role, code){

    this.signingUp = true;
    let cred;
    try{ cred = await Au.createUserWithEmailAndPassword(auth, this.email(id), pw); }
    catch(e){ this.signingUp = false; throw e; }
    try{
      const joinHash = await this.sha('oneulmohae-join:' + code.trim());
      const b = F.writeBatch(db);
      b.set(F.doc(db, 'families', FAM, 'roles', role), {uid: cred.user.uid, joinHash, at: Date.now()});
      b.set(F.doc(db, 'families', FAM, 'accounts', cred.user.uid), {role, id: id.trim(), joinHash, at: Date.now()});
      await b.commit();
    }catch(e){
      await cred.user.delete().catch(() => {});
      this.signingUp = false;
      throw e;
    }
    this.signingUp = false;
    await Store.onUser(cred.user);
  },
  async logout(){ const {Au, auth} = Store.fs; await Push.disable().catch(() => {}); await Au.signOut(auth); }
};

/* ───────── 가족 BGM: 로그인한 가족만 받을 수 있게 Firestore에 조각으로 저장 ─────────
   폰마다 처음 한 번만 내려받아 이 기기에 보관해요 */
const FamilySong = {
  CHUNK: 700 * 1024,
  meta: null,
  ref(id){ const {F, db} = Store.fs; return F.doc(db, 'families', FAM, 'bgm', id); },
  async sync(){
    if(Store.mode !== 'live') return;
    const {F} = Store.fs;
    const ms = await F.getDoc(this.ref('meta'));
    this.meta = ms.exists() ? ms.data() : null;
    const cached = await SongStore.get();
    if(!this.meta){ if(cached){ await SongStore.clear(); await BGM.reload(); } if(state.tab === 'set') render(); return; }
    if(cached && cached.id === this.meta.id){ if(!BGM.song) await BGM.reload(); if(state.tab === 'set') render(); return; }
    const parts = [];
    for(let i = 0; i < this.meta.chunks; i++){
      const c = await F.getDoc(this.ref('c' + i));
      if(!c.exists()) throw new Error('chunk missing ' + i);
      parts.push(Uint8Array.from(atob(c.data().data), ch => ch.charCodeAt(0)));
    }
    await SongStore.put({id: this.meta.id, name: this.meta.name, blob: new Blob(parts, {type: this.meta.type || 'audio/mpeg'})});
    await BGM.reload();
    if(state.tab === 'set') render();
  },
  b64(blob){ return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = () => rej(r.error); r.readAsDataURL(blob); }); },
  async upload(file){
    const n = Math.ceil(file.size / this.CHUNK), id = uid(), old = this.meta;
    for(let i = 0; i < n; i++){
      toast(`노래 올리는 중… ${Math.round(i / n * 100)}%`);
      await Store.fs.F.setDoc(this.ref('c' + i), {i, data: await this.b64(file.slice(i * this.CHUNK, (i + 1) * this.CHUNK))});
    }
    const name = file.name.replace(/\.[^.]+$/, '');
    await Store.fs.F.setDoc(this.ref('meta'), {id, name, chunks: n, type: file.type || 'audio/mpeg', size: file.size, by: ME, at: Date.now()});
    if(old) for(let i = n; i < old.chunks; i++) await Store.fs.F.deleteDoc(this.ref('c' + i)).catch(() => {});
    await SongStore.put({id, name, blob: file});
    this.meta = {id, name, chunks: n, by: ME};
    await BGM.reload();
  },
  async remove(){
    const old = this.meta;
    await Store.fs.F.deleteDoc(this.ref('meta'));
    if(old) for(let i = 0; i < old.chunks; i++) await Store.fs.F.deleteDoc(this.ref('c' + i)).catch(() => {});
    this.meta = null; await SongStore.clear(); await BGM.reload();
  }
};

    if(!Store.fs.storage) Store.fs.storage = Store.fs.St.getStorage(Store.fs.db.app);

/* ───────── 프로필 사진 자르기 (끌기 + 확대/축소 + 두 손가락) ───────── */
const Crop = {
  V: 240, OUT: 360,
  async open(m, src, revoke){
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
    m.crop = {src, img, w: img.naturalWidth, h: img.naturalHeight, zoom: 1, x: 0, y: 0, revoke};
    renderModal();
  },
  close(m){ if(m.crop && m.crop.revoke) URL.revokeObjectURL(m.crop.src); m.crop = null; },
  size(c){ const k = this.V / Math.min(c.w, c.h) * c.zoom; return {W: c.w * k, H: c.h * k}; },
  clamp(c){
    const {W, H} = this.size(c);
    const mx = (W - this.V) / 2, my = (H - this.V) / 2;
    c.x = Math.max(-mx, Math.min(mx, c.x)); c.y = Math.max(-my, Math.min(my, c.y));
  },
  paint(c){
    const el = $('#crop-img'); if(!el) return;
    this.clamp(c);
    const {W, H} = this.size(c);
    el.style.width = W + 'px'; el.style.height = H + 'px';
    el.style.transform = `translate(${c.x - W/2}px, ${c.y - H/2}px)`;
    const z = $('#crop-zoom'); if(z && document.activeElement !== z) z.value = c.zoom;
  },
  render(c){
    const cv = document.createElement('canvas'); cv.width = cv.height = this.OUT;
    const r = this.OUT / this.V, {W, H} = this.size(c);
    const g = cv.getContext('2d');
    g.fillStyle = '#fff'; g.fillRect(0, 0, this.OUT, this.OUT);
    g.drawImage(c.img, (this.V/2 + c.x - W/2) * r, (this.V/2 + c.y - H/2) * r, W * r, H * r);
    return cv.toDataURL('image/jpeg', .85);
  },
  pts: new Map(), last: null
};
document.addEventListener('pointerdown', e => {
  const v = e.target.closest('#crop-view'); const c = state.modal && state.modal.crop; if(!v || !c) return;
  e.preventDefault(); v.setPointerCapture(e.pointerId);
  Crop.pts.set(e.pointerId, {x: e.clientX, y: e.clientY}); Crop.last = null;
});
document.addEventListener('pointermove', e => {
  const c = state.modal && state.modal.crop; if(!c || !Crop.pts.has(e.pointerId)) return;
  const prev = Crop.pts.get(e.pointerId);
  Crop.pts.set(e.pointerId, {x: e.clientX, y: e.clientY});
  if(Crop.pts.size === 1){ c.x += e.clientX - prev.x; c.y += e.clientY - prev.y; }
  else if(Crop.pts.size === 2){
    const [p, q] = [...Crop.pts.values()]; const d = Math.hypot(p.x - q.x, p.y - q.y);
    if(Crop.last) c.zoom = Math.max(1, Math.min(4, c.zoom * d / Crop.last));
    Crop.last = d;
  }
  Crop.paint(c);
});
['pointerup','pointercancel'].forEach(ev => document.addEventListener(ev, e => { Crop.pts.delete(e.pointerId); Crop.last = null; }));
document.addEventListener('wheel', e => {
  const c = state.modal && state.modal.crop; if(!c || !e.target.closest('#crop-view')) return;
  e.preventDefault(); c.zoom = Math.max(1, Math.min(4, c.zoom * (e.deltaY < 0 ? 1.08 : 1/1.08))); Crop.paint(c);
}, {passive:false});

/* ───────── 배경음악: 앱 안에서 만드는 오르골 멜로디 (음원 파일 없음) ─────────
   아이폰은 'ambient' 오디오라서 무음 모드(벨소리 스위치)면 소리가 안 나요. */
const SongStore = {
  db(){ return new Promise((res, rej) => { const r = indexedDB.open('tmh-bgm', 1); r.onupgradeneeded = () => r.result.createObjectStore('s'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async get(){ try{ const d = await this.db(); return await new Promise(res => { const q = d.transaction('s').objectStore('s').get('song'); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); }); }catch(e){ return null; } },
  async put(v){ const d = await this.db(); await new Promise((res, rej) => { const t = d.transaction('s', 'readwrite'); t.objectStore('s').put(v, 'song'); t.oncomplete = res; t.onerror = () => rej(t.error); }); },
  async clear(){ try{ const d = await this.db(); await new Promise(res => { const t = d.transaction('s', 'readwrite'); t.objectStore('s').delete('song'); t.oncomplete = res; t.onerror = res; }); }catch(e){} }
};
const BGM = {
  ctx:null, master:null, timer:0, step:0, next:0, unlocked:false,
  song:null, songName:'', audio:null,
  async reload(){ this.stop(); await this.loadSong(); this.start(); },  // 들어올 때마다 바로 재생 시도
  async loadSong(){
    const v = await SongStore.get();
    if(this.audio){ this.audio.pause(); this.audio = null; }
    if(this.song) URL.revokeObjectURL(this.song);
    this.song = v && v.blob ? URL.createObjectURL(v.blob) : null;
    this.songName = v ? v.name : '';
  },
  on: ls.get('tmh_bgm', true),
  // 8마디 x 8분음표. null = 쉼표 (C장조 오르골)
  MEL: [76,null,79,null,81,79,76,null, 74,null,76,null,72,null,null,null,
        72,null,76,null,81,null,79,76, 79,null,null,null,76,74,null,null,
        81,null,79,null,77,null,76,null, 74,null,76,null,77,null,null,null,
        79,null,74,null,79,81,79,null, 74,null,76,null,79,null,null,null],
  CHORDS: [[48,52,55],[45,48,52],[41,45,48],[43,47,50]],
  start(){
    if(!this.on) return;
    if(navigator.audioSession){ try{ navigator.audioSession.type = 'ambient'; }catch(e){} }
    if(this.song){
      if(!this.audio){ this.audio = new Audio(this.song); this.audio.loop = true; this.audio.volume = .45; }
      this.audio.play().then(() => { this.unlocked = true; }).catch(() => {});
      return;
    }
    if(this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    if(this.timer) return;
    try{
      const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return;
      if(!this.ctx){ this.ctx = new AC(); this.master = this.ctx.createGain(); this.master.gain.value = 0; this.master.connect(this.ctx.destination); }
      if(this.ctx.state === 'suspended') this.ctx.resume();
      this.master.gain.cancelScheduledValues(this.ctx.currentTime);
      this.master.gain.setTargetAtTime(.07, this.ctx.currentTime, 1.5);
      this.next = this.ctx.currentTime + .15;
      this.timer = setInterval(() => this.tick(), 90);
    }catch(e){ console.warn('bgm', e); }
  },
  stop(){
    if(this.audio) this.audio.pause();
    clearInterval(this.timer); this.timer = 0;
    if(this.ctx) this.master.gain.setTargetAtTime(0, this.ctx.currentTime, .25);
  },
  toggle(){ this.on = !this.on; ls.set('tmh_bgm', this.on); this.on ? this.start() : this.stop(); },
  tick(){
    const eighth = 60 / 84 / 2;
    while(this.next < this.ctx.currentTime + .35){ this.play(this.step, this.next); this.step = (this.step + 1) % 64; this.next += eighth; }
  },
  hz: m => 440 * Math.pow(2, (m - 69) / 12),
  tone(m, t, dur, vol, type){
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.value = this.hz(m);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .008); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + .05);
  },
  play(s, t){
    const ch = this.CHORDS[Math.floor(s / 16)], i = s % 8, mel = this.MEL[s];
    if(mel){ this.tone(mel, t, 1.3, .55, 'sine'); this.tone(mel + 12, t, .5, .12, 'triangle'); }
    if(i === 0) this.tone(ch[0], t, 1.6, .35, 'sine');
    if(i === 2 || i === 6) this.tone(ch[1] + 12, t, .9, .12, 'triangle');
    if(i === 4) this.tone(ch[2] + 12, t, .9, .12, 'triangle');
  }
};

/* ───────── 푸시 알림 (Firebase Cloud Messaging) ───────── */
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
const isStandalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const Push = {
  id: ls.get('tmh_push', null),
  supported(){ return 'serviceWorker' in navigator && 'Notification' in window && 'PushManager' in window; },
  state(){
    if(!this.supported()) return isIOS && !isStandalone ? 'need-install' : 'unsupported';
    if(Notification.permission === 'denied') return 'denied';
    return this.id && Notification.permission === 'granted' ? 'on' : 'off';
  },
  async messaging(){
    const M = await import(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-messaging.js`);
    return {M, msg: M.getMessaging(Store.fs.db.app)};
  },
  async enable(){
    if(Store.mode !== 'live') throw new Error('인터넷에 연결된 뒤에 켤 수 있어요');
    const perm = await Notification.requestPermission();
    if(perm !== 'granted') throw new Error('알림 권한이 꺼져 있어요. 폰 설정에서 허용해 주세요');
    const reg = await navigator.serviceWorker.register('/firebase-messaging-sw.js');
    const {M, msg} = await this.messaging();
    const token = await M.getToken(msg, {serviceWorkerRegistration: reg});
    if(!token) throw new Error('알림 연결에 실패했어요. 잠시 후 다시 해 주세요');
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(token));
    this.id = [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join('').slice(0, 40);
    await Store.set('pushTokens', this.id, {token, member: ME, at: Date.now(), device: navigator.userAgent.slice(0, 120)});
    ls.set('tmh_push', this.id);
  },
  async disable(){
    if(this.id) await Store.del('pushTokens', this.id);
    this.id = null; ls.set('tmh_push', null);
    try{ const {M, msg} = await this.messaging(); await M.deleteToken(msg); }catch(e){}
  },
  // 이 기기 사용자를 바꾸면, 알림도 새 사용자 기준으로 (본인 글 알림 제외용)
  syncMember(){ if(this.id) Store.update('pushTokens', this.id, {member: ME}); }
};

/* ───────── 알림 눌렀을 때 해당 화면으로 ───────── */
let pendingGo = null;
function goTo(g){
  if(!g || !g.type) return;
  if(g.type === 'event'){
    state.tab = 'cal';
    const ds = g.date || S.events[g.id]?.date;
    if(ds){ const d = parse(ds); state.month = new Date(d.getFullYear(), d.getMonth(), 1); state.sel = ds; }
    state.modal = {kind:'ev', id:g.id, date:ds, live:true};
    render();
  } else if(g.type === 'memo' || g.type === 'suggest'){
    state.tab = 'board'; state.modal = null; render(); window.scrollTo({top:0});
  } else if(g.type === 'day' && g.date){
    state.tab = 'cal'; const d = parse(g.date);
    state.month = new Date(d.getFullYear(), d.getMonth(), 1); state.sel = g.date;
    state.modal = {kind:'day', date:g.date, live:true}; render();
  } else if(g.type === 'photo'){
    state.tab = 'board'; state.fridgeOpen = true; state.modal = null; render();
    setTimeout(() => document.getElementById('ph-' + g.id)?.scrollIntoView({behavior:'smooth', block:'start'}), 250);
  } else if(g.type === 'praise'){
    state.tab = 'home'; state.modal = null; render();
    setTimeout(() => $('.praises')?.closest('.card')?.scrollIntoView({behavior:'smooth', block:'start'}), 250);
  }
}
function takeGo(g){ if(Store.mode === 'live') goTo(g); else pendingGo = g; }
(() => {
  const p = new URLSearchParams(location.search);
  if(p.get('go')){ pendingGo = {type:p.get('go'), id:p.get('id') || '', date:p.get('date') || ''}; history.replaceState(null, '', location.pathname); }
  if('serviceWorker' in navigator){
    navigator.serviceWorker.addEventListener('message', e => { if(e.data && e.data.go) takeGo(e.data.go); });
    navigator.serviceWorker.getRegistration().then(r => r && r.update()).catch(() => {});  // 새 알림 처리 코드 바로 받기
  }
})();
// 글꼴이 늦게 도착하면 달 제목 크기를 다시 맞춤
if(document.fonts){
  const refit = () => { if(state.tab === 'cal') fitTitle(); };
  Promise.all([document.fonts.load('400 60px "Black Han Sans"', '9월'), document.fonts.load('900 60px Archivo', 'SEP')]).then(refit, refit);
  document.fonts.addEventListener && document.fonts.addEventListener('loadingdone', refit);
}
BGM.loadSong().then(() => BGM.start());
render();
Store.init();
})();
</script>
